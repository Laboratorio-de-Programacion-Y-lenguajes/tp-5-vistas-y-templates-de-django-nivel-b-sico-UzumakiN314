
{% extends "base.html" %}

{% block content %}
    <h1>Listado de Publicaciones</h1>
    <ul>
        {% for pub in publicacion_list %}
            <li>
                <a href="{% url 'publicaciones:detalle_publicacion' pub.pk %}">{{ pub.titulo }}</a><br>
                Autor: {{ pub.autor }}<br>
                Fecha: {{ pub.fecha_publicacion }}
            </li>
        {% empty %}
            <li>No hay publicaciones disponibles aún.</li>
        {% endfor %}
    </ul>
{% endblock %}
